<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tiket Soal Matematika</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">Sistem Pembagian Soal Matematika</h1>

        <!-- Status & Notifikasi -->
        <div id="status-message" class="mb-6 p-3 bg-red-100 text-red-700 border border-red-400 rounded text-center font-bold text-lg hidden transition-colors duration-300">
            Pengisian sedang ditutup oleh Admin.
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Bagian Kiri: Form User -->
            <div class="border p-5 rounded-lg bg-blue-50 shadow-sm">
                <h2 class="text-xl font-semibold mb-4 text-blue-900">Pilih Soal Kamu</h2>
                <form id="ticket-form">
                    <div class="mb-4">
                        <label class="block mb-1 font-medium text-gray-700">Nama Penjawab</label>
                        <input type="text" id="nama" class="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-blue-200 disabled:bg-gray-200 disabled:cursor-not-allowed transition" required placeholder="Masukkan nama kamu...">
                    </div>
                    <div class="mb-4">
                        <label class="block mb-1 font-medium text-gray-700">Nomor Absen</label>
                        <input type="number" id="absen" min="1" class="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-blue-200 disabled:bg-gray-200 disabled:cursor-not-allowed transition" required placeholder="Contoh: 15">
                    </div>
                    <div class="mb-5">
                        <label class="block mb-1 font-medium text-gray-700">Pilih Nomor Soal</label>
                        <select id="nomor-soal" class="w-full border border-gray-300 p-2 rounded focus:ring focus:ring-blue-200 disabled:bg-gray-200 disabled:cursor-not-allowed transition" required>
                            <option value="" disabled selected>-- Memuat Soal... --</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">*Soal yang sudah dipilih orang lain tidak akan muncul.</p>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-semibold p-2 rounded hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">Ambil Soal</button>
                </form>
            </div>

            <!-- Bagian Kanan: Live Dashboard -->
            <div class="border p-5 rounded-lg bg-green-50 shadow-sm">
                <h2 class="text-xl font-semibold mb-4 text-green-900">Daftar Penjawab (Live)</h2>
                <div class="overflow-y-auto max-h-80 bg-white border rounded">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-green-200">
                            <tr>
                                <th class="p-3 border-b text-center w-20">No. Soal</th>
                                <th class="p-3 border-b">Nama</th>
                                <th class="p-3 border-b text-center w-24">Absen</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-list">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-500">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tombol Buka Admin -->
        <div class="mt-8 text-center">
            <button id="btn-show-admin" class="text-gray-400 hover:text-gray-600 text-sm font-medium transition">Akses Admin</button>
        </div>

        <!-- Panel Admin (Tersembunyi by default) -->
        <div id="admin-panel" class="hidden mt-4 p-5 border border-gray-300 rounded-lg bg-gray-100 shadow-inner">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Panel Kontrol Admin</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <div class="bg-white p-4 rounded border">
                    <label class="block mb-2 font-medium text-gray-700 text-sm">Total Pertanyaan:</label>
                    <div class="flex gap-2">
                        <input type="number" id="total-soal-input" class="border p-2 rounded w-full focus:ring focus:ring-gray-200 text-sm">
                        <button id="btn-update-soal" class="bg-gray-700 text-white px-3 py-2 rounded hover:bg-gray-800 text-sm">Set</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded border">
                    <label class="block mb-2 font-medium text-gray-700 text-sm">Kontrol Akses Form:</label>
                    <div class="flex gap-2">
                        <button id="btn-open" class="flex-1 bg-green-600 text-white px-2 py-2 rounded font-semibold hover:bg-green-700 transition text-sm">Buka (5s)</button>
                        <button id="btn-close" class="flex-1 bg-red-600 text-white px-2 py-2 rounded font-semibold hover:bg-red-700 transition text-sm">Tutup</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded border flex flex-col justify-center">
                    <label class="block mb-2 font-medium text-gray-700 text-sm">Database:</label>
                    <button id="btn-reset" class="bg-gray-900 text-white px-4 py-2 rounded font-semibold hover:bg-black transition text-sm">Hapus Semua Responden</button>
                </div>

            </div>
        </div>
    </div>

    <!-- FIREBASE SDK & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // Firebase Config Kamu
        const firebaseConfig = {
            apiKey: "AIzaSyCJaHDENyiCeStP7gJMxN4Ck7bFB7eHbdY",
            authDomain: "mtkticketing.firebaseapp.com",
            projectId: "mtkticketing",
            storageBucket: "mtkticketing.firebasestorage.app",
            messagingSenderId: "31572951375",
            appId: "1:31572951375:web:fb1b28ca6f60cfae89053a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ticketsCol = collection(db, "tickets");
        const configDoc = doc(db, "settings", "main");

        // State Global
        let totalSoal = 0;
        let isLocked = true; // Default locked until config loaded
        let claimedTickets = [];
        let countdownInterval;

        // DOM Elements
        const form = document.getElementById("ticket-form");
        const inputNama = document.getElementById("nama");
        const inputAbsen = document.getElementById("absen");
        const selectSoal = document.getElementById("nomor-soal");
        
        const dashboard = document.getElementById("dashboard-list");
        const statusMessage = document.getElementById("status-message");
        const btnSubmit = document.getElementById("submit-btn");
        
        const adminPanel = document.getElementById("admin-panel");
        const btnShowAdmin = document.getElementById("btn-show-admin");
        const inputTotalSoal = document.getElementById("total-soal-input");
        const btnUpdateSoal = document.getElementById("btn-update-soal");
        
        // Admin Buttons
        const btnOpen = document.getElementById("btn-open");
        const btnClose = document.getElementById("btn-close");
        const btnReset = document.getElementById("btn-reset");

        // Fungsi Kunci Input
        function disableFormInputs() {
            inputNama.disabled = true;
            inputAbsen.disabled = true;
            selectSoal.disabled = true;
            btnSubmit.disabled = true;
        }

        // Fungsi Buka Input
        function enableFormInputs() {
            inputNama.disabled = false;
            inputAbsen.disabled = false;
            selectSoal.disabled = false;
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Ambil Soal";
        }

        // 1. Sinkronisasi Konfigurasi Admin (Real-time & Countdown logic)
        onSnapshot(configDoc, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                totalSoal = data.totalSoal || 20; 
                isLocked = data.isLocked;
                const unlockTime = data.unlockTime || 0;
                
                inputTotalSoal.value = totalSoal;
                
                // Hentikan interval countdown sebelumnya jika ada perubahan mendadak
                clearInterval(countdownInterval);

                if (isLocked) {
                    // JIKA FORM DITUTUP
                    statusMessage.classList.remove("hidden", "bg-yellow-100", "text-yellow-700", "border-yellow-400");
                    statusMessage.classList.add("bg-red-100", "text-red-700", "border-red-400");
                    statusMessage.innerText = "Pengisian ditutup oleh Admin.";
                    
                    disableFormInputs();
                    btnSubmit.innerText = "Form Ditutup";
                    
                    // Reset isi form jika ada yang lagi ngetik
                    form.reset();
                    updateDropdown();
                } else {
                    // JIKA FORM BERSTATUS DIBUKA (Cek waktu unlock)
                    const now = Date.now();
                    if (now < unlockTime) {
                        // Jika saat ini belum melewati waktu unlock -> Hitung Mundur
                        disableFormInputs();
                        btnSubmit.innerText = "Bersiaplah...";
                        
                        statusMessage.classList.remove("hidden", "bg-red-100", "text-red-700", "border-red-400");
                        statusMessage.classList.add("bg-yellow-100", "text-yellow-700", "border-yellow-400");
                        
                        // Menjalankan Timer secara visual tiap detik
                        countdownInterval = setInterval(() => {
                            const timeLeft = Math.ceil((unlockTime - Date.now()) / 1000);
                            if (timeLeft > 0) {
                                statusMessage.innerText = `Form akan dibuka dalam ${timeLeft}...`;
                            } else {
                                clearInterval(countdownInterval);
                                enableFormInputs();
                                statusMessage.classList.add("hidden");
                                updateDropdown();
                            }
                        }, 250); // Loop cepat agar mulus
                    } else {
                        // Waktu sudah normal terbuka
                        enableFormInputs();
                        statusMessage.classList.add("hidden");
                        updateDropdown();
                    }
                }
            } else {
                setDoc(configDoc, { totalSoal: 20, isLocked: true });
            }
        });

        // 2. Sinkronisasi Data Penjawab (Real-time)
        onSnapshot(ticketsCol, (snapshot) => {
            claimedTickets = [];
            dashboard.innerHTML = "";
            
            const dataDocs = [];
            snapshot.forEach((doc) => {
                dataDocs.push({ id: parseInt(doc.id), ...doc.data() });
                claimedTickets.push(parseInt(doc.id));
            });
            
            dataDocs.sort((a, b) => a.id - b.id);
            
            if (dataDocs.length === 0) {
                dashboard.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">Belum ada yang memilih soal.</td></tr>`;
            } else {
                dataDocs.forEach((data) => {
                    const tr = document.createElement("tr");
                    tr.classList.add("hover:bg-green-100", "transition");
                    tr.innerHTML = `
                        <td class="p-3 border-b text-center font-bold text-green-800">${data.id}</td>
                        <td class="p-3 border-b text-gray-800">${data.nama}</td>
                        <td class="p-3 border-b text-center text-gray-600">${data.absen}</td>
                    `;
                    dashboard.appendChild(tr);
                });
            }
            updateDropdown();
        });

        // Fungsi memperbarui dropdown
        function updateDropdown() {
            const currentValue = selectSoal.value;
            selectSoal.innerHTML = '<option value="" disabled selected>-- Pilih Nomor Soal --</option>';
            
            let availableCount = 0;
            for (let i = 1; i <= totalSoal; i++) {
                if (!claimedTickets.includes(i)) {
                    const option = document.createElement("option");
                    option.value = i;
                    option.textContent = `Soal No. ${i}`;
                    selectSoal.appendChild(option);
                    availableCount++;
                }
            }

            if (availableCount === 0 && !isLocked) {
                selectSoal.innerHTML = '<option value="" disabled selected>Semua soal habis terambil!</option>';
            }
            
            if (currentValue && !claimedTickets.includes(parseInt(currentValue))) {
                selectSoal.value = currentValue;
            }
        }

        // 3. Handle Submit Form User
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (inputNama.disabled || selectSoal.disabled) return;

            const nama = inputNama.value.trim();
            const absen = inputAbsen.value;
            const soalDipilih = selectSoal.value;

            if (!soalDipilih) return alert("Silakan pilih nomor soal yang tersedia.");

            // Matikan tombol sementara agar tidak double klik
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengirim...";

            try {
                await setDoc(doc(ticketsCol, soalDipilih.toString()), {
                    nama: nama,
                    absen: absen,
                    timestamp: new Date()
                });
                form.reset();
            } catch (error) {
                console.error("Error saving data:", error);
                alert("Gagal mengambil soal, pastikan koneksi internet stabil.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Ambil Soal";
            }
        });

        // ==========================================
        // LOGIK ADMIN
        // ==========================================

        btnShowAdmin.addEventListener("click", () => {
            const password = prompt("Masukkan Password Admin:");
            if (password === "ikhlas2809") {
                adminPanel.classList.remove("hidden");
                btnShowAdmin.classList.add("hidden");
            } else if (password !== null) {
                alert("Password salah!");
            }
        });

        btnUpdateSoal.addEventListener("click", async () => {
            const newVal = parseInt(inputTotalSoal.value);
            if (newVal > 0) {
                await updateDoc(configDoc, { totalSoal: newVal });
                alert("Total soal berhasil diupdate!");
            } else {
                alert("Masukkan angka yang valid!");
            }
        });

        // BUKA FORM (Dengan Delay 5 Detik)
        btnOpen.addEventListener("click", async () => {
            try {
                // Set unlockTime ke 5000ms (5 detik) dari waktu sekarang
                const targetTime = Date.now() + 5000;
                await updateDoc(configDoc, { 
                    isLocked: false,
                    unlockTime: targetTime
                });
            } catch (e) {
                alert("Gagal mengupdate status database.");
            }
        });

        // TUTUP FORM (Langsung Instan)
        btnClose.addEventListener("click", async () => {
            try {
                await updateDoc(configDoc, { isLocked: true });
            } catch (e) {
                alert("Gagal menutup form.");
            }
        });

        // HAPUS RESPONDEN (Tombol Terpisah)
        btnReset.addEventListener("click", async () => {
            const confirmReset = confirm("Peringatan: Aksi ini akan MENGHAPUS SEMUA DATA PENJAWAB. Lanjutkan?");
            if (!confirmReset) return;

            btnReset.innerText = "Menghapus Data...";
            btnReset.disabled = true;

            try {
                const querySnapshot = await getDocs(ticketsCol);
                const deletePromises = [];
                querySnapshot.forEach((document) => {
                    deletePromises.push(deleteDoc(doc(db, "tickets", document.id)));
                });
                
                await Promise.all(deletePromises);
                alert("Seluruh data penjawab telah direset.");
            } catch (error) {
                console.error("Error Reset:", error);
                alert("Terjadi kesalahan saat menghapus data.");
            } finally {
                btnReset.innerText = "Hapus Semua Responden";
                btnReset.disabled = false;
            }
        });
    </script>
</body>
</html>
