<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tiket Soal — The Phantoms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Anton&display=swap" rel="stylesheet">
    <style>
        /* TEMA PERSONA 5 */
        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 15px 15px;
            font-family: 'Special Elite', monospace;
            color: #fff;
            overflow-x: hidden;
        }

        h1, h2, .font-marker { font-family: 'Permanent Marker', cursive; }
        .font-anton { font-family: 'Anton', sans-serif; letter-spacing: 1px; }

        .top-right-decor {
            position: absolute; top: 20px; right: 30px;
            background: #000; color: #fff;
            font-family: 'Permanent Marker', cursive;
            padding: 5px 15px; font-size: 20px;
            transform: rotate(4deg); border: 3px solid #fff;
            box-shadow: -4px 4px 0 #e0000b; z-index: 10;
        }

        .p5-container {
            background: #000; border: 4px solid #e0000b;
            clip-path: polygon(1% 0%, 100% 2%, 98% 100%, 0% 98%);
            position: relative;
        }
        .p5-container::after {
            content: ''; position: absolute;
            top: 3px; right: 3px; bottom: 3px; left: 3px;
            background: #111; clip-path: polygon(2% 4%, 96% 3%, 98% 94%, 4% 96%);
            z-index: -1;
        }

        .p5-input {
            background: #fff; color: #000; border: 3px solid #000;
            box-shadow: 4px 4px 0 #e0000b; transform: skewX(-3deg);
            border-radius: 0; font-weight: bold;
        }
        .p5-input:focus { outline: none; background: #ffe6e6; box-shadow: 4px 4px 0 #000; }
        .p5-input:disabled { background: #555; color: #222; box-shadow: 4px 4px 0 #222; cursor: not-allowed; border-color: #333; }

        .p5-btn {
            background: #e0000b; color: #fff; border: 2px solid #fff;
            transform: skewX(-10deg) rotate(-1deg); box-shadow: -3px 3px 0 #000;
            text-transform: uppercase; transition: all 0.2s ease;
        }
        .p5-btn:hover:not(:disabled) {
            background: #fff; color: #e0000b; box-shadow: -4px 4px 0 #e0000b;
            transform: skewX(-10deg) rotate(0deg) scale(1.02);
        }
        .p5-btn:disabled { background: #333; color: #777; border-color: #555; box-shadow: none; }

        .p5-table th { background: #e0000b; color: #fff; font-family: 'Anton', sans-serif; border-bottom: 3px solid #fff; letter-spacing: 1px; }
        .p5-table tr { border-bottom: 1px solid #333; transition: all 0.2s; }
        .p5-table tr:hover { background: rgba(224, 0, 11, 0.2); }
        .p5-table td { color: #ddd; }
        .p5-table .td-highlight { color: #e0000b; font-weight: bold; font-family: 'Anton', sans-serif; font-size: 1.2rem;}

        .status-box { clip-path: polygon(0 5%, 100% 0, 98% 95%, 2% 100%); transform: rotate(-1deg); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid #e0000b; }
        ::-webkit-scrollbar-thumb { background: #e0000b; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="top-right-decor hidden md:block">SMAN 8 JAKARTA LOG</div>

    <div class="max-w-6xl mx-auto">
        
        <!-- HEADER -->
        <div class="text-center mb-8 relative">
            <h1 class="text-5xl md:text-6xl text-red-600 mb-2 transform -rotate-2 drop-shadow-[3px_3px_0_#fff]">TICKETING SOAL</h1>
            <p class="font-anton text-xl tracking-widest text-gray-400 transform skew-x-[-10deg]">METAVERSE OPERATION // MATHEMATICS</p>
        </div>

        <!-- Status & Notifikasi -->
        <div id="status-message" class="status-box mb-8 p-4 text-center font-bold text-2xl font-anton uppercase hidden border-4 border-black"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- KIRI: Form User -->
            <div class="lg:col-span-5 p5-container p-6 shadow-[8px_8px_0_#000]">
                <h2 class="text-3xl text-white mb-6 transform -rotate-2 drop-shadow-[2px_2px_0_#e0000b]">TAKE YOUR TARGET</h2>
                
                <form id="ticket-form" class="flex flex-col gap-5">
                    <div>
                        <label class="block mb-2 font-bold text-red-500 font-anton text-lg tracking-wider">CODENAME (NAMA)</label>
                        <input type="text" id="nama" class="w-full p-3 p5-input" required placeholder="Masukkan namamu...">
                    </div>
                    <div>
                        <label class="block mb-2 font-bold text-red-500 font-anton text-lg tracking-wider">ID NUMBER (ABSEN)</label>
                        <input type="number" id="absen" min="1" class="w-full p-3 p5-input" required placeholder="Contoh: 15">
                    </div>
                    <div>
                        <label class="block mb-2 font-bold text-red-500 font-anton text-lg tracking-wider">TARGET (NO. SOAL)</label>
                        <select id="nomor-soal" class="w-full p-3 p5-input cursor-pointer" required>
                            <option value="" disabled selected>-- SECURING DATA... --</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn" class="mt-4 p-4 text-2xl font-anton p5-btn w-full">AMBIL SOAL</button>
                </form>
            </div>

            <!-- KANAN: Live Dashboard -->
            <div class="lg:col-span-7 p5-container p-6 shadow-[8px_8px_0_#000]">
                <h2 class="text-3xl text-white mb-6 transform rotate-1 drop-shadow-[2px_2px_0_#e0000b]">PHANTOM OPERATIVES</h2>
                
                <div class="overflow-y-auto max-h-[400px] border-2 border-red-600 bg-black p-1">
                    <table class="w-full text-left border-collapse p5-table">
                        <thead class="sticky top-0 z-10">
                            <tr>
                                <th class="p-4 text-center w-24">NO. SOAL</th>
                                <th class="p-4">CODENAME</th>
                                <th class="p-4 text-center w-24">ABSEN</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-list">
                            <tr><td colspan="3" class="p-6 text-center text-gray-500 font-bold font-anton tracking-widest text-xl">INTERCEPTING SIGNALS...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tombol Login Admin -->
        <div class="mt-12 text-right relative z-20">
            <button id="btn-login-admin" class="font-anton text-gray-600 hover:text-red-500 text-lg tracking-widest transition uppercase">>>> AUTHENTICATE ADMIN</button>
        </div>

        <!-- Panel Admin -->
        <div id="admin-panel" class="hidden mt-6 p5-container p-6 border-white bg-gray-900 shadow-[5px_5px_0_#e0000b]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl text-red-500 font-anton">NAVIGATOR CONTROLS</h2>
                <button id="btn-logout" class="text-xs bg-gray-700 hover:bg-red-600 text-white font-anton px-3 py-1 border border-white">LOGOUT ADMIN</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Total Soal -->
                <div class="bg-black p-4 border-2 border-gray-700">
                    <label class="block mb-3 font-bold text-gray-300 font-anton tracking-wider">SET MAX TARGETS</label>
                    <div class="flex gap-2">
                        <input type="number" id="total-soal-input" class="w-full p-2 p5-input text-center">
                        <button id="btn-update-soal" class="p-2 bg-gray-200 text-black font-anton font-bold hover:bg-white transition border-2 border-black">SET</button>
                    </div>
                </div>

                <!-- Form Control -->
                <div class="bg-black p-4 border-2 border-gray-700">
                    <label class="block mb-3 font-bold text-gray-300 font-anton tracking-wider">SYSTEM LOCK</label>
                    <div class="flex flex-col gap-2">
                        <button id="btn-open" class="p-2 bg-white text-black border-2 border-red-600 font-anton hover:bg-red-600 hover:text-white transition">BREACH (BUKA 5s)</button>
                        <button id="btn-close" class="p-2 bg-red-600 text-white font-anton hover:bg-red-800 transition">LOCKDOWN (TUTUP)</button>
                    </div>
                </div>

                <!-- Reset Data -->
                <div class="bg-black p-4 border-2 border-gray-700 flex flex-col justify-center">
                    <label class="block mb-3 font-bold text-gray-300 font-anton tracking-wider">WIPE PALACE DATA</label>
                    <button id="btn-reset" class="p-3 bg-red-900 border-2 border-red-500 text-white font-anton hover:bg-red-600 transition shadow-[3px_3px_0_#000]">ERASE ALL LOGS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        // Import Module Authentication
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // ==========================================
        // KONFIGURASI ADMIN EMAIL (GANTI DENGAN EMAIL ASLI KAMU!)
        // ==========================================
        const ADMIN_EMAIL = "emailkamu@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCJaHDENyiCeStP7gJMxN4Ck7bFB7eHbdY",
            authDomain: "mtkticketing.firebaseapp.com",
            projectId: "mtkticketing",
            storageBucket: "mtkticketing.firebasestorage.app",
            messagingSenderId: "31572951375",
            appId: "1:31572951375:web:fb1b28ca6f60cfae89053a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Setup Auth
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ticketsCol = collection(db, "tickets");
        const configDoc = doc(db, "settings", "main");

        let totalSoal = 0;
        let isLocked = true;
        let claimedTickets = [];
        let countdownInterval;

        const form = document.getElementById("ticket-form");
        const inputNama = document.getElementById("nama");
        const inputAbsen = document.getElementById("absen");
        const selectSoal = document.getElementById("nomor-soal");
        const dashboard = document.getElementById("dashboard-list");
        const statusMessage = document.getElementById("status-message");
        const btnSubmit = document.getElementById("submit-btn");
        
        const adminPanel = document.getElementById("admin-panel");
        const btnLoginAdmin = document.getElementById("btn-login-admin");
        const btnLogout = document.getElementById("btn-logout");
        const inputTotalSoal = document.getElementById("total-soal-input");
        const btnUpdateSoal = document.getElementById("btn-update-soal");
        const btnOpen = document.getElementById("btn-open");
        const btnClose = document.getElementById("btn-close");
        const btnReset = document.getElementById("btn-reset");

        // ==========================================
        // SISTEM AUTENTIKASI ADMIN
        // ==========================================
        
        // Memantau status login (berjalan otomatis setiap kali web dibuka)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    // Jika admin berhasil login
                    adminPanel.classList.remove("hidden");
                    btnLoginAdmin.classList.add("hidden");
                } else {
                    // Jika orang lain yang mencoba login
                    alert("ACCESS DENIED: Email ini bukan otoritas Admin.");
                    signOut(auth); // Langsung logout otomatis
                    adminPanel.classList.add("hidden");
                    btnLoginAdmin.classList.remove("hidden");
                }
            } else {
                // Jika belum login
                adminPanel.classList.add("hidden");
                btnLoginAdmin.classList.remove("hidden");
            }
        });

        // Tombol Login dipencet
        btnLoginAdmin.addEventListener("click", () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Gagal Login:", error);
                alert("Login dibatalkan atau terjadi kesalahan jaringan.");
            });
        });

        // Tombol Logout dipencet
        btnLogout.addEventListener("click", () => {
            signOut(auth).then(() => {
                alert("Berhasil keluar dari mode Admin.");
            });
        });

        // ==========================================
        // LOGIK FORM & DATABASE (Sama seperti sebelumnya)
        // ==========================================

        function disableFormInputs() {
            inputNama.disabled = true; inputAbsen.disabled = true;
            selectSoal.disabled = true; btnSubmit.disabled = true;
        }

        function enableFormInputs() {
            inputNama.disabled = false; inputAbsen.disabled = false;
            selectSoal.disabled = false; btnSubmit.disabled = false;
            btnSubmit.innerText = "AMBIL SOAL";
        }

        onSnapshot(configDoc, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                totalSoal = data.totalSoal || 20; 
                isLocked = data.isLocked;
                const unlockTime = data.unlockTime || 0;
                
                inputTotalSoal.value = totalSoal;
                clearInterval(countdownInterval);

                if (isLocked) {
                    statusMessage.classList.remove("hidden", "bg-yellow-400", "text-black");
                    statusMessage.classList.add("bg-red-600", "text-white");
                    statusMessage.innerText = "SYSTEM LOCKDOWN ACTIVE";
                    disableFormInputs();
                    btnSubmit.innerText = "ACCESS DENIED";
                    form.reset();
                    updateDropdown();
                } else {
                    const now = Date.now();
                    if (now < unlockTime) {
                        disableFormInputs();
                        btnSubmit.innerText = "PREPARING BREACH...";
                        statusMessage.classList.remove("hidden", "bg-red-600", "text-white");
                        statusMessage.classList.add("bg-yellow-400", "text-black");
                        
                        countdownInterval = setInterval(() => {
                            const timeLeft = Math.ceil((unlockTime - Date.now()) / 1000);
                            if (timeLeft > 0) {
                                statusMessage.innerText = `INFILTRATION IN: 00:0${timeLeft}`;
                            } else {
                                clearInterval(countdownInterval);
                                enableFormInputs();
                                statusMessage.classList.add("hidden");
                                updateDropdown();
                            }
                        }, 250); 
                    } else {
                        enableFormInputs();
                        statusMessage.classList.add("hidden");
                        updateDropdown();
                    }
                }
            } else {
                setDoc(configDoc, { totalSoal: 20, isLocked: true });
            }
        });

        onSnapshot(ticketsCol, (snapshot) => {
            claimedTickets = [];
            dashboard.innerHTML = "";
            const dataDocs = [];
            snapshot.forEach((doc) => {
                dataDocs.push({ id: parseInt(doc.id), ...doc.data() });
                claimedTickets.push(parseInt(doc.id));
            });
            dataDocs.sort((a, b) => a.id - b.id);
            if (dataDocs.length === 0) {
                dashboard.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-600 font-anton text-xl tracking-widest">NO TARGETS SECURED YET.</td></tr>`;
            } else {
                dataDocs.forEach((data) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="p-4 text-center td-highlight text-xl">${data.id}</td>
                        <td class="p-4 font-bold tracking-wider">${data.nama.toUpperCase()}</td>
                        <td class="p-4 text-center text-gray-400 font-bold">${data.absen}</td>
                    `;
                    dashboard.appendChild(tr);
                });
            }
            updateDropdown();
        });

        function updateDropdown() {
            const currentValue = selectSoal.value;
            selectSoal.innerHTML = '<option value="" disabled selected>-- SELECT TARGET --</option>';
            let availableCount = 0;
            for (let i = 1; i <= totalSoal; i++) {
                if (!claimedTickets.includes(i)) {
                    const option = document.createElement("option");
                    option.value = i;
                    option.textContent = `TARGET NO. ${i}`;
                    selectSoal.appendChild(option);
                    availableCount++;
                }
            }
            if (availableCount === 0 && !isLocked) {
                selectSoal.innerHTML = '<option value="" disabled selected>ALL TARGETS SECURED!</option>';
            }
            if (currentValue && !claimedTickets.includes(parseInt(currentValue))) {
                selectSoal.value = currentValue;
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (inputNama.disabled || selectSoal.disabled) return;
            const nama = inputNama.value.trim();
            const absen = inputAbsen.value;
            const soalDipilih = selectSoal.value;
            if (!soalDipilih) return alert("PILIH TARGET YANG VALID!");

            btnSubmit.disabled = true;
            btnSubmit.innerText = "HACKING...";
            try {
                await setDoc(doc(ticketsCol, soalDipilih.toString()), {
                    nama: nama, absen: absen, timestamp: new Date()
                });
                form.reset();
            } catch (error) {
                alert("KONEKSI METAVERSE TERPUTUS. COBA LAGI.");
            } finally {
                if(!isLocked) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "AMBIL SOAL";
                }
            }
        });

        btnUpdateSoal.addEventListener("click", async () => {
            const newVal = parseInt(inputTotalSoal.value);
            if (newVal > 0) { await updateDoc(configDoc, { totalSoal: newVal }); }
        });
        btnOpen.addEventListener("click", async () => {
            const targetTime = Date.now() + 5000;
            await updateDoc(configDoc, { isLocked: false, unlockTime: targetTime });
        });
        btnClose.addEventListener("click", async () => {
            await updateDoc(configDoc, { isLocked: true });
        });
        btnReset.addEventListener("click", async () => {
            const confirmReset = confirm("WARNING: THIS WILL WIPE ALL STOLEN TARGETS. CONTINUE?");
            if (!confirmReset) return;
            btnReset.innerText = "ERASING..."; btnReset.disabled = true;
            try {
                const querySnapshot = await getDocs(ticketsCol);
                const deletePromises = [];
                querySnapshot.forEach((document) => {
                    deletePromises.push(deleteDoc(doc(db, "tickets", document.id)));
                });
                await Promise.all(deletePromises);
            } finally {
                btnReset.innerText = "ERASE ALL LOGS"; btnReset.disabled = false;
            }
        });
    </script>
</body>
</html>
